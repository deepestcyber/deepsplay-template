<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock</title>
<script type="application/toml" id="deepsplay-page">
description = "A large clock with the date. A page in its own folder, using the shared theme."
uses = ["theme"]

[params.format]
type        = "enum"
values      = ["24h", "12h"]
default     = "24h"
description = "Hour format."

[params.seconds]
type        = "bool"
default     = false
description = "Show seconds."

[params.locale]
type        = "string"
default     = "en-GB"
description = "Language and region for the date, e.g. de-DE."

[[variants]]
label = "12 hours with seconds"
query = "format=12h&seconds=true"

[[variants]]
label = "German date"
query = "locale=de-DE"
</script>
<script src="/lib/v1/deepsplay.js"></script>
<link rel="stylesheet" href="../shared/theme/theme.css">
<script src="../shared/theme/theme.js"></script>
<style>
  body {
    display: grid;
    place-content: center;
    text-align: center;
  }
  #time {
    font-size: clamp(3rem, 22vmin, 30rem);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
  }
  #date {
    margin-top: 2vmin;
    font-size: clamp(1rem, 4vmin, 5rem);
    color: var(--muted);
  }
  #date::before {
    content: "";
    display: block;
    width: 8vmin;
    height: 0.8vmin;
    margin: 0 auto 3vmin;
    background: var(--accent);
  }
</style>
</head>
<body>
<div id="time"></div>
<div id="date"></div>

<script>
  const P = Deepsplay.params()
  const time = new Intl.DateTimeFormat(P.locale, {
    hour: "numeric",
    minute: "2-digit",
    second: P.seconds ? "2-digit" : undefined,
    hour12: P.format === "12h",
  })
  const date = new Intl.DateTimeFormat(P.locale, { weekday: "long", day: "numeric", month: "long" })

  function tick() {
    const now = new Date()
    document.getElementById("time").textContent = time.format(now)
    document.getElementById("date").textContent = date.format(now)
  }
  tick()
  setInterval(tick, 1000)
</script>
</body>
</html>
